services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: motobike_shop
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d motobike_shop"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
    volumes:
      - motobike_postgres_data:/var/lib/postgresql/data

volumes:
  motobike_postgres_data:
